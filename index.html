  <!-- Sound -->
  <audio id="ding" src="https://cdn.pixabay.com/audio/2023/03/07/audio_254774b19e.mp3" preload="auto"></audio>

  <script>
    const form = document.getElementById('govTripForm');
    const submitBtn = document.getElementById('submitBtn');
    const ding = document.getElementById('ding');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const url = "https://docs.google.com/forms/d/e/1FAIpQLSfRkgrRo7RdoQY-XXvKAFx3qET87IAbobnwYR8kGUJJMkdzbA/formResponse";

      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      ding.play();
      alert("เจ้าหน้าที่ธุรการได้รับข้อมูลของท่านแล้ว ขอบคุณค่ะ");
      submitBtn.style.backgroundColor = "green";
      submitBtn.textContent = "ส่งข้อมูลสำเร็จ";

      setTimeout(() => {
        form.reset();
        submitBtn.style.backgroundColor = "red";
        submitBtn.textContent = "บันทึกข้อมูล";
      }, 2000);
    });
  </script>
