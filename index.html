<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบบันทึกการไปราชการ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    function submitForm() {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://docs.google.com/forms/d/e/1FAIpQLSe2bgES3KRlgbRgXCH98s6onj1h_2PPDGrfofx1w91rbs2tqQ/viewform?usp=pp_url&entry.511106264=%E0%B8%99%E0%B8%B2%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%93%E0%B8%B4%E0%B8%A8%E0%B8%B2++%E0%B8%81%E0%B8%B2%E0%B8%8D%E0%B8%88%E0%B8%99%E0%B9%8C%E0%B8%AD%E0%B8%99%E0%B8%B8%E0%B8%81%E0%B8%B9%E0%B8%A5&entry.996525214=%E0%B8%84%E0%B8%A3%E0%B8%B9&entry.466501182=%E0%B8%A7%E0%B8%B4%E0%B8%97%E0%B8%A2%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%97%E0%B8%84%E0%B9%82%E0%B8%99%E0%B9%82%E0%B8%A5%E0%B8%A2%E0%B8%B5&entry.1160258534=2025-05-02&entry.772710380=1&entry.2135839748=aaa&entry.413572869=aaa";
      form.target = "hidden_iframe";

      const data = {
        "entry.511106264": document.getElementById("fullname").value,
        "entry.996525214": document.getElementById("position").value,
        "entry.466501182": document.getElementById("department").value,
        "entry.2135839748": document.getElementById("subject").value,
        "entry.1160258534": document.getElementById("date").value,
        "entry.772710380": document.getElementById("days").value,
        "entry.413572869": document.getElementById("location").value,
        "entry.2135839749": document.getElementById("organizer").value
      };

      for (let key in data) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = data[key];
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();

      document.getElementById("submit-btn").style.backgroundColor = "#16a34a";
      document.getElementById("ding").play();
      const msg = document.createElement("div");
      msg.innerText = "เจ้าหน้าที่ธุรการได้รับข้อมูลของท่านแล้ว ขอบคุณค่ะ";
      msg.style = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border:3px solid #f97316;border-radius:12px;font-size:20px;color:black;z-index:9999;";
      document.body.appendChild(msg);

      setTimeout(() => {
        msg.remove();
        document.querySelector("form").reset();
        document.getElementById("submit-btn").style.backgroundColor = "#dc2626";
      }, 2000);
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      background: white;
      color: black;
      margin: 0;
    }
    header {
      background: #047857;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    header img {
      width: 150px;
      margin-bottom: 10px;
    }
    main {
      max-width: 700px;
      margin: auto;
      padding: 1rem;
    }
    .form-container {
      border: 3px solid #f97316;
      border-radius: 1rem;
      padding: 1.5rem;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 1rem;
    }
    label span {
      display: block;
      margin-bottom: 0.25rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
    }
    button {
      background: #dc2626;
      color: white;
      padding: 0.75rem;
      border: none;
      width: 100%;
      border-radius: 0.75rem;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.3s;
    }
    footer {
      text-align: center;
      font-size: 0.875rem;
      color: #9ca3af;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <!-- Sound Effect -->
  <audio id="ding" src="https://cdn.pixabay.com/audio/2023/03/07/audio_254774b19e.mp3" preload="auto"></audio>

  <!-- Header -->
  <header>
    <img src="https://lh4.googleusercontent.com/Wg9o9hrUZx9L4PMce-qv5Yg3y_rEEyAHXhAz0bMfzoifzZo_MNDFfMz-yX7cdVHFlgbU8B12n1AkUzXYUKHsfo_bVMmRrMQOhtraNP9xICGzvHiIwial-Xp-iw8Rt4eSGw=w1280" alt="โลโก้โรงเรียน">
    <h1>ระบบบันทึกการไปราชการของบุคลากรโรงเรียนบ้านหนองหัวแรด</h1>
  </header>

  <!-- Form -->
  <main>
    <div class="form-container">
      <form onsubmit="event.preventDefault(); submitForm();">
        <label>
          <span>ชื่อ-สกุล</span>
          <select id="fullname" required>
            <option disabled selected>-- เลือกชื่อ --</option>
            <option>นายสืบพงษ์ ทัพหลวง</option>
            <!-- ... more options as provided ... -->
            <option>MISS.MARY JEAN Q BELUAN</option>
          </select>
        </label>
        <label>
          <span>ตำแหน่ง</span>
          <select id="position" required>
            <option disabled selected>-- เลือกตำแหน่ง --</option>
            <option>ครู</option>
            <!-- ... -->
          </select>
        </label>
        <label>
          <span>กลุ่มสาระการเรียนรู้</span>
          <select id="department" required>
            <option disabled selected>-- เลือกกลุ่มสาระ --</option>
            <option>ภาษาไทย</option>
            <!-- ... -->
          </select>
        </label>
        <label>
          <span>เรื่องที่ไปราชการ</span>
          <input type="text" id="subject" required>
        </label>
        <label>
          <span>วันที่ไป</span>
          <input type="date" id="date" required>
        </label>
        <label>
          <span>จำนวนวัน</span>
          <input type="number" id="days" required>
        </label>
        <label>
          <span>สถานที่</span>
          <input type="text" id="location" required>
        </label>
        <label>
          <span>หน่วยงานที่จัด</span>
          <input type="text" id="organizer" required>
        </label>
        <button type="submit" id="submit-btn">บันทึกข้อมูล</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 ระบบบันทึกข้อมูลไปราชการ โดย Kru-onnz Zaa
  </footer>

  <iframe name="hidden_iframe" style="display:none;"></iframe>
</body>
</html>
