<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกการไปราชการ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .form-box {
      border: 2px solid #ff6600; /* orange */
    }
    .submit-button {
      background-color: #dc2626; /* red */
    }
    .submit-button.submitted {
      background-color: #16a34a !important; /* green */
    }
  </style>
</head>
<body class="bg-green-100 text-black">
  <!-- Header -->
  <header class="text-center py-6 bg-green-600 text-white">
    <img src="https://lh4.googleusercontent.com/Wg9o9hrUZx9L4PMce-qv5Yg3y_rEEyAHXhAz0bMfzoifzZo_MNDFfMz-yX7cdVHFlgbU8B12n1AkUzXYUKHsfo_bVMmRrMQOhtraNP9xICGzvHiIwial-Xp-iw8Rt4eSGw=w1280"
         alt="โลโก้โรงเรียน"
         class="mx-auto mb-4 w-32">
    <h1 class="text-2xl font-semibold">ระบบบันทึกการไปราชการของบุคลากรโรงเรียนบ้านหนองหัวแรด</h1>
  </header>

  <!-- Form -->
  <main class="max-w-3xl mx-auto p-4">
    <form id="tripForm" class="bg-green-50 shadow-md rounded-xl p-6 space-y-4 form-box">
      <!-- Inputs: Use same IDs from your original snippet -->
      <label class="block">
        <span>ชื่อ-สกุล</span>
        <select id="fullname" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
          <option disabled selected>-- เลือกชื่อ --</option>
          <option>นายสืบพงษ์ ทัพหลวง</option>
          <option>นางสาวสุพรรษา ดวงกระโทก</option>
          <option>นางกมลวัลย์ รัตนกุล</option>
           <option>นางสาวปัญณิศา  กาญจน์อนุกูล</option>
          <option>นางสาวสุดาณิษา  ปัทมสกุลชัย</option>
          <option>นางนวรัตน์  ทิศกระโทก</option>
          <option>นางสาวพวงผกา  มะสีผา</option>
          <option>นางสาวพันนิภา  ดาผา</option>
          <option>นางสาวศิริกานดา  ภิรักษ์ศักดิ์</option>
          <option>นางสาวเพ็ญนภา  อรรถมนัดถุ์</option>
          <option>นางสาวบัณฑิตา  เพิ่มพิบูลย์</option>
          <option>นางสาววรรนิภา  มั่งมูล</option>
          <option>นางสาวเพ็ญทิวา  โฉมงาม</option>
          <option>นายภูบดินทร์  หาญกลาง</option>
          <option>นางสาวจริยา  แผนพิมาย</option>
          <option>นางสาวจุฑาพร  ตลับทอง</option>
          <option>นางสาวจิราพร   อ้อมนอก</option>
          <option>นางสาวณัชชา  ซึมกระโทก</option>
          <option>นางอาภัสรา  ดวงกระโทก</option>
          <option>นางสาวภาวิณี  อาษาวัง</option>
          <option>นางสาวกมลพรรณ  ตั้นสูงเนิน</option>
          <option>นางสาวสุวรรณา  คลุ้มกระโทก</option>
          <option>นางสาวลลิตา  โมงกระโทก</option>
          <option>นางสาวพริ้มเพรา  มุ่งกลาง</option>
          <option>นางสาวสิริทิพย์  สอนกิ่ง</option>
          <option>นางสาวปทิตตา  สิทธิจันทร์</option>
          <option>นายธนานนท์   ตะคอนรัมย์</option>
          <option>นางสาวณิชกานต์   อุพลรัมย์</option>
          <option>นายอภิวุฒิ   พรมมาสิม</option>
          <option>นายสิริคุปต์   ฉอุ่มผล</option>
          <option>นางสาวกัญญารัตน์   จอมคำสิงห์</option>
          <option>นางสาวญาณิศา   การรุ่งเรือง</option>
          <option>นางสาววิมลศิริ   กรุยกระโทก</option>
          <option>นางสาวชุลีพร   เลิศนา</option>
          <option>นางสาวธันยพร   มูลกระโทก</option>
          <option>นางสาวปานชนก   บุตรน้ำรัก</option>
          <option>นางสาวสุภาพร   แซ่หาญ</option>
          <option>นางสาวสุนิสา   เกิ้นโนนกอก</option>
          <option>นางสาวกรภัทร์  สมจิต</option>
          <option>นางสาวกัญญาวีร์  ชุติมานุตสกุล</option>
          <option>นายธวัชชัย   พรมพาน</option>
          <option>นางสาวประณยา  เรียนไธสง</option>
          <option>นางสาวอุมาพร  จิมมอญ</option>
          <option>นางสาววนิดา  ชัยปลัด</option>
          <option>นายภานุวัฒน์ วงศ์ละคร </option>
          <option>นายรชตภูมิ  ปัตตังเว</option>
          <option>MISTER.JUN-JUN  TENEDERO</option>
          <option>MISS.MARY JEAN Q BELUAN</option>

        </select>
      </label>

      <label class="block">
        <span>ตำแหน่ง</span>
        <select id="position" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
          <option disabled selected>-- เลือกตำแหน่ง --</option>
          <option>ผู้อำนวยการโรงเรียน</option>
          <option>รองผู้อำนวยการโรงเรียน</option>
          <option>ครู</option>
          <option>ครูอัตราจ้าง</option>
          <option>อื่นๆ</option>
        </select>
      </label>

      <label class="block">
        <span>กลุ่มสาระการเรียนรู้</span>
        <select id="department" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
          <option disabled selected>-- เลือกกลุ่มสาระ --</option>
          <option>ภาษาไทย</option>
          <option>คณิตศาสตร์</option>
          <option>วิทยาศาสตร์และเทคโนโลยี</option>
          <option>สังคมศึกษา</option>
          <option>สุขศึกษาและพลศึกษา</option>
          <option>ศิลปะ</option>
          <option>การงานอาชีพ</option>
          <option>ภาษาต่างประเทศ</option>

        </select>
      </label>

      <label class="block">
        <span>เรื่องที่ไปราชการ</span>
        <input type="text" id="subject" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
      </label>

      <label class="block">
        <span>วันที่ไป</span>
        <input type="date" id="date" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
      </label>

      <label class="block">
        <span>จำนวนวัน</span>
        <input type="number" id="days" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
      </label>

      <label class="block">
        <span>สถานที่</span>
        <input type="text" id="location" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
      </label>

      <label class="block">
        <span>หน่วยงานที่จัด</span>
        <input type="text" id="organizer" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
      </label>

      <button type="submit" class="submit-button text-white font-bold py-2 px-4 rounded-xl w-full transition-all">
        บันทึกข้อมูล
      </button>
    </form>
  </main>

  <footer class="text-center text-gray-400 text-sm mt-10 mb-4">
    © 2025 ระบบบันทึกข้อมูลไปราชการ โดย Kru-onnz Zaa
  </footer>
</body>
</html>
