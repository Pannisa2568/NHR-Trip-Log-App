<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบบันทึกการไปราชการ</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-800">
  <header class="text-center py-6 bg-green-700 text-white">
    <img src="https://lh4.googleusercontent.com/Wg9o9hrUZx9L4PMce-qv5Yg3y_rEEyAHXhAz0bMfzoifzZo_MNDFfMz-yX7cdVHFlgbU8B12n1AkUzXYUKHsfo_bVMmRrMQOhtraNP9xICGzvHiIwial-Xp-iw8Rt4eSGw=w1280" alt="โลโก้โรงเรียน" class="mx-auto w-[150px] mb-2">
    <h1 class="text-2xl font-bold">ระบบบันทึกการไปราชการของบุคลากรโรงเรียนบ้านหนองหัวแรด</h1>
  </header>

  <main class="max-w-3xl mx-auto p-4">
    <form id="tripForm" class="bg-white shadow-md rounded-xl p-6 space-y-4 border border-gray-200">
      <div>
        <label class="block mb-1 font-medium">ชื่อ-สกุล</label>
        <select id="fullname" class="w-full border border-gray-300 rounded px-3 py-2">
          <option value="">-- เลือกชื่อบุคลากร --</option>
          <option>นายสืบพงษ์ ทัพหลวง</option>
          <option>นางสาวสุพรรษา ดวงกระโทก</option>
          <option>นางกมลวัลย์ รัตนกุล</option>
          <option>นางสาวปัญณิศา กาญจน์อนุกูล</option>
          <option>นางสาวสุดาณิษา ปัทมสกุลชัย</option>
          <option>นางนวรัตน์ ทิศกระโทก</option>
          <option>นางสาวพวงผกา มะสีผา</option>
          <option>นางสาวพันนิภา ดาผา</option>
          <option>นางสาวศิริกานดา ภิรักษ์ศักดิ์</option>
          <option>นางสาวเพ็ญนภา อรรถมนัดถุ์</option>
          <option>นางสาวบัณฑิตา เพิ่มพิบูลย์</option>
          <option>นางสาววรรนิภา มั่งมูล</option>
          <option>นางสาวเพ็ญทิวา โฉมงาม</option>
          <option>นายภูบดินทร์ หาญกลาง</option>
          <option>นางสาวจริยา แผนพิมาย</option>
          <option>นางสาวจุฑาพร ตลับทอง</option>
          <option>นางสาวจิราพร อ้อมนอก</option>
          <option>นางสาวณัชชา ซึมกระโทก</option>
          <option>นางอาภัสรา ดวงกระโทก</option>
          <option>นางสาวภาวิณี อาษาวัง</option>
          <option>นางสาวกมลพรรณ ตั้นสูงเนิน</option>
          <option>นางสาวสุวรรณา คลุ้มกระโทก</option>
          <option>นางสาวลลิตา โมงกระโทก</option>
          <option>นางสาวพริ้มเพรา มุ่งกลาง</option>
          <option>นางสาวสิริทิพย์ สอนกิ่ง</option>
          <option>นางสาวปทิตตา สิทธิจันทร์</option>
          <option>นายธนานนท์ ตะคอนรัมย์</option>
          <option>นางสาวณิชกานต์ อุพลรัมย์</option>
          <option>นายอภิวุฒิ พรมมาสิม</option>
          <option>นายณัฐพงษ์ สีแลง</option>
          <option>นายสิริคุปต์ ฉอุ่มผล</option>
          <option>นางสาวกัญญารัตน์ จอมคำสิงห์</option>
          <option>นางสาวญาณิศา การรุ่งเรือง</option>
          <option>นางสาววิมลศิริ กรุยกระโทก</option>
          <option>นางสาวชุลีพร เลิศนา</option>
          <option>นางสาวธันยพร มูลกระโทก</option>
          <option>นางสาวปานชนก บุตรน้ำรัก</option>
          <option>นางสาวสุภาพร แซ่หาญ</option>
          <option>นางสาวสุนิสา เกิ้นโนนกอก</option>
          <option>นางสาวกรภัทร์ สมจิต</option>
          <option>นางสาวกัญญาวีร์ ชุติมานุตสกุล</option>
          <option>นายธวัชชัย พรมพาน</option>
          <option>นางสาวประณยา เรียนไธสง</option>
          <option>นางสาวอุมาพร จิมมอญ</option>
          <option>นางสาววนิดา ชัยปลัด</option>
          <option>นายภานุวัฒน์ วงศ์ละคร</option>
          <option>นายรชตภูมิ ปัตตังเว</option>
          <option>MISTER.JUN-JUN TENEDERO</option>
          <option>MISS.MARY JEAN Q BELUAN</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">ตำแหน่ง</label>
        <select id="position" class="w-full border border-gray-300 rounded px-3 py-2">
          <option value="">-- เลือกตำแหน่ง --</option>
          <option>ผู้อำนวยการโรงเรียน</option>
          <option>รองผู้อำนวยการโรงเรียน</option>
          <option>ครู</option>
          <option>ครูอัตราจ้าง</option>
          <option>อื่นๆ</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">กลุ่มสาระการเรียนรู้</label>
        <select id="department" class="w-full border border-gray-300 rounded px-3 py-2">
          <option value="">-- เลือกกลุ่มสาระ --</option>
          <option>ภาษาไทย</option>
          <option>คณิตศาสตร์</option>
          <option>วิทยาศาสตร์และเทคโนโลยี</option>
          <option>สังคมศึกษา</option>
          <option>สุขศึกษาและพลศึกษา</option>
          <option>ศิลปะ</option>
          <option>การงานอาชีพ</option>
          <option>ภาษาต่างประเทศ</option>
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">เรื่องที่ไปราชการ</label>
        <input type="text" id="subject" class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-medium">วันที่ไป</label>
          <input type="date" id="date" class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <div>
          <label class="block mb-1 font-medium">จำนวนวัน</label>
          <input type="number" id="days" class="w-full border border-gray-300 rounded px-3 py-2" min="1" />
        </div>
      </div>
      <div>
        <label class="block mb-1 font-medium">สถานที่</label>
        <input type="text" id="location" class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <div>
        <label class="block mb-1 font-medium">หน่วยงานที่จัด</label>
        <input type="text" id="organizer" class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white text-lg font-semibold py-2 px-6 rounded w-full">บันทึกข้อมูล</button>
    </form>
  </main>

  <footer class="text-center text-sm text-gray-400 py-4">© 2025 ระบบบันทึกข้อมูลไปราชการ โดย Kru-onnz Zaa</footer>

  <script>
    document.getElementById("tripForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        fullname: document.getElementById("fullname").value,
        position: document.getElementById("position").value,
        department: document.getElementById("department").value,
        subject: document.getElementById("subject").value,
        date: document.getElementById("date").value,
        days: document.getElementById("days").value,
        location: document.getElementById("location").value,
        organizer: document.getElementById("organizer").value
      };

      try {
        const response = await fetch("https://docs.google.com/forms/d/e/1FAIpQLSe2bgES3KRlgbRgXCH98s6onj1h_2PPDGrfofx1w91rbs2tqQ/viewform?usp=pp_url&entry.511106264=%E0%B8%99%E0%B8%B2%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%93%E0%B8%B4%E0%B8%A8%E0%B8%B2++%E0%B8%81%E0%B8%B2%E0%B8%8D%E0%B8%88%E0%B8%99%E0%B9%8C%E0%B8%AD%E0%B8%99%E0%B8%B8%E0%B8%81%E0%B8%B9%E0%B8%A5&entry.996525214=%E0%B8%84%E0%B8%A3%E0%B8%B9&entry.466501182=%E0%B8%A7%E0%B8%B4%E0%B8%97%E0%B8%A2%E0%B8%B2%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%97%E0%B8%84%E0%B9%82%E0%B8%99%E0%B9%82%E0%B8%A5%E0%B8%A2%E0%B8%B5&entry.1160258534=2025-05-12&entry.772710380=1&entry.2135839748=xxx&entry.413572869=xxx", {
          method: "POST",
          headers: {
            "Content-Type": "text/plain"
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          Swal.fire({
            icon: "success",
            title: "✅ ส่งคำขอเรียบร้อยแล้ว",
            confirmButtonText: "ตกลง",
            background: "#16a34a",
            color: "white"
          });
          document.getElementById("tripForm").reset();
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      }
    });
  </script>
</body>
</html>
