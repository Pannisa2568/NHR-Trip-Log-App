<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบบันทึกการไปราชการ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    function submitForm() {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = "https://docs.google.com/forms/d/e/1FAIpQLSe2bgES3KRlgbRgXCH98s6onj1h_2PPDGrfofx1w91rbs2tqQ/formResponse";
      form.target = "hidden_iframe";

      const data = {
        "entry.511106264": document.getElementById("fullname").value,
        "entry.996525214": document.getElementById("position").value,
        "entry.466501182": document.getElementById("department").value,
        "entry.2135839748": document.getElementById("subject").value,
        "entry.1160258534": document.getElementById("date").value,
        "entry.772710380": document.getElementById("days").value,
        "entry.413572869": document.getElementById("location").value,
        "entry.2135839749": document.getElementById("organizer").value
      };

      for (let key in data) {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = data[key];
        form.appendChild(input);
      }

      document.body.appendChild(form);
      form.submit();

      document.getElementById("submit-btn").style.backgroundColor = "#16a34a";
      document.getElementById("ding").play();
      const msg = document.createElement("div");
      msg.innerText = "เจ้าหน้าที่ธุรการได้รับข้อมูลของท่านแล้ว ขอบคุณค่ะ";
      msg.style = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border:3px solid #f97316;border-radius:12px;font-size:20px;color:black;z-index:9999;";
      document.body.appendChild(msg);

      setTimeout(() => {
        msg.remove();
        document.querySelector("form").reset();
        document.getElementById("submit-btn").style.backgroundColor = "#dc2626";
      }, 2000);
    }
  </script>
  <style>
    body {
      font-family: sans-serif;
      background: white;
      color: black;
      margin: 0;
    }
    header {
      background: #047857;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    header img {
      width: 150px;
      margin-bottom: 10px;
    }
    main {
      max-width: 700px;
      margin: auto;
      padding: 1rem;
    }
    .form-container {
      border: 3px solid #f97316;
      border-radius: 1rem;
      padding: 1.5rem;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 1rem;
    }
    label span {
      display: block;
      margin-bottom: 0.25rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
    }
    button {
      background: #dc2626;
      color: white;
      padding: 0.75rem;
      border: none;
      width: 100%;
      border-radius: 0.75rem;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.3s;
    }
    footer {
      text-align: center;
      font-size: 1.0rem;
      color: #9ca3af;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <!-- Sound Effect -->
  <audio id="ding" src="https://cdn.pixabay.com/audio/2023/03/07/audio_254774b19e.mp3" preload="auto"></audio>

  <!-- Header -->

    <img src="https://lh4.googleusercontent.com/Wg9o9hrUZx9L4PMce-qv5Yg3y_rEEyAHXhAz0bMfzoifzZo_MNDFfMz-yX7cdVHFlgbU8B12n1AkUzXYUKHsfo_bVMmRrMQOhtraNP9xICGzvHiIwial-Xp-iw8Rt4eSGw=w1280" alt="โลโก้โรงเรียน">
    <h1>ระบบบันทึกการไปราชการของบุคลากรโรงเรียนบ้านหนองหัวแรด</h1>

          <option>MISTER.JUN-JUN  TENEDERO</option>
          <option>MISS.MARY JEAN Q BELUAN</option>

          </select>
        </label>
        <label>
          <span>ตำแหน่ง</span>
          <select id="position" required>
            <option disabled selected>-- เลือกตำแหน่ง --</option>
          <option>ผู้อำนวยการโรงเรียน</option>

        </label>
        <label>

          <select id="department" required>
            <option disabled selected>-- เลือกกลุ่มสาระ --</option>
          <option>ภาษาไทย</option>

        </label>

        <label>

        <button type="submit" id="submit-btn">บันทึกข้อมูล</button>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 ระบบบันทึกข้อมูลไปราชการ โดย Kru-onnz Zaa
  </footer>

  <iframe name="hidden_iframe" style="display:none;"></iframe>
</body>
</html>
