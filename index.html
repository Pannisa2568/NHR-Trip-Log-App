<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบบันทึกการไปราชการโรงเรียนบ้านหนองหัวแรด</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      background-color: #fff;
      color: #000;
      padding: 20px;
    }
    h1 {
      color: orange;
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: auto;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      color: #000;
    }
    label {
      display: block;
      margin-top: 15px;
      color: #000;
    }
    select, input[type="text"], input[type="number"], input[type="date"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      color: #000;
    }
    button {
      background-color: red;
      color: white;
      border: none;
      padding: 15px;
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #000;
    }
    img.header-logo {
      display: block;
      margin: 0 auto 10px auto;
      height: 150px;
    }
  </style>
</head>
<body>

  <img class="header-logo" src="https://lh4.googleusercontent.com/Wg9o9hrUZx9L4PMce-qv5Yg3y_rEEyAHXhAz0bMfzoifzZo_MNDFfMz-yX7cdVHFlgbU8B12n1AkUzXYUKHsfo_bVMmRrMQOhtraNP9xICGzvHiIwial-Xp-iw8Rt4eSGw=w1280" alt="Logo">
  <h1>ระบบบันทึกการไปราชการโรงเรียนบ้านหนองหัวแรด</h1>

  <form id="govTripForm">
    <label>ชื่อ-สกุล</label>
    <select name="entry.511106264" required>
      <option value="" disabled selected>-- เลือกชื่อ --</option>
      <option>นายสืบพงษ์   ทัพหลวง</option>
      <option>นางสาวสุพรรษา   ดวงกระโทก</option>
      <option>นางกมลวัลย์  รัตนกุล</option>
      <option>นางสาวปัญณิศา  กาญจน์อนุกูล</option>
      <option>นางสาวสุดาณิษา  ปัทมสกุลชัย</option>
      <!-- Add the rest of the names here -->
      <option>MISTER.JUN-JUN  TENEDERO</option>
      <option>MISS.MARY JEAN Q BELUAN</option>
    </select>

    <label>ตำแหน่ง</label>
    <select name="entry.996525214" required>
      <option disabled selected>-- เลือกตำแหน่ง --</option>
      <option>ผู้อำนวยการโรงเรียน</option>
      <option>รองผู้อำนวยการโรงเรียน</option>
      <option>ครู</option>
      <option>ครูอัตราจ้าง</option>
      <option>อื่นๆ</option>
    </select>

    <label>กลุ่มสาระการเรียนรู้</label>
    <select name="entry.466501182" required>
      <option disabled selected>-- เลือกกลุ่มสาระ --</option>
      <option>ภาษาไทย</option>
      <option>คณิตศาสตร์</option>
      <option>วิทยาศาสตร์และเทคโนโลยี</option>
      <option>สังคมศึกษา</option>
      <option>สุขศึกษาและพลศึกษา</option>
      <option>ศิลปะ</option>
      <option>การงานอาชีพ</option>
      <option>ภาษาต่างประเทศ</option>
    </select>

    <label>เรื่องที่ไปราชการ</label>
    <input type="text" name="entry.1030558349" required>

    <label>วันที่ไป</label>
    <input type="date" name="entry.1160258534" required>

    <label>จำนวนวัน</label>
    <input type="number" name="entry.772710380" required>

    <label>สถานที่</label>
    <input type="text" name="entry.2135839748" required>

    <label>หน่วยงานที่จัด</label>
    <input type="text" name="entry.413572869" required>

    <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
  </form>

  <footer>
    © 2025 ระบบบันทึกข้อมูลไปราชการ โดย Kru-onnz Zaa
  </footer>

  <!-- Sound -->
  <audio id="ding" src="https://cdn.pixabay.com/audio/2023/03/07/audio_254774b19e.mp3" preload="auto"></audio>

  <script>
    const form = document.getElementById('govTripForm');
    const submitBtn = document.getElementById('submitBtn');
    const ding = document.getElementById('ding');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const url = "https://docs.google.com/forms/d/e/1FAIpQLSe2bgES3KRlgbRgXCH98s6onj1h_2PPDGrfofx1w91rbs2tqQ/formResponse";

      await fetch(url, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });

      // Feedback
      ding.play();
      alert("เจ้าหน้าที่ธุรการได้รับข้อมูลของท่านแล้ว ขอบคุณค่ะ");
      submitBtn.style.backgroundColor = "green";
      submitBtn.textContent = "ส่งข้อมูลสำเร็จ";

      setTimeout(() => {
        form.reset();
        submitBtn.style.backgroundColor = "red";
        submitBtn.textContent = "บันทึกข้อมูล";
      }, 2000);
    });
  </script>

</body>
</html>
